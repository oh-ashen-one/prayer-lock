name: Miqat
options:
  bundleIdPrefix: com.ashen
  deploymentTarget:
    iOS: "26.0"
targets:
  Miqat:
    type: application
    platform: iOS
    sources:
      - Miqat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashen.miqat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
